# Peaky 8-bit configuration
# See https://zmk.dev/docs/development/hardware-integration/new-shield

# Uncomment to enable the encoder
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y

# Combos: Peaky 8-bit chord input configuration
# Default values are too low for 8-key combos.

# Maximum number of keys per combo (default: 4, need 8 for Peaky 8-bit)
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=8

# Maximum number of combos per key (default: 5)
# Full v0.3 keymap: pos 2 participates in 134 combos (the most of any key)
# Set to 160 for safety margin
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=160

# Maximum number of pressed combos at the same time (default: 4)
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8

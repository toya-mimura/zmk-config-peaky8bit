# This file was generated from a template. Edit it to match your keyboard.
# See https://zmk.dev/docs/development/hardware-integration/new-shield for more
# instructions.

# This file will be copied into the user's config directory when they add this
# keyboard. Define any Kconfig options users may frequently want to set here,
# but leave them commented out, for example:

# Uncomment to enable the encoder
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y

# Combos: Peaky 8-bit chord input configuration
# Default values are too low for 8-key combos.

# Maximum number of keys per combo (default: 4, need 8 for Peaky 8-bit)
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=8

# Maximum number of combos per key (default: 5, eventually need 128)
# Set to 128 now to verify build with future expansion in mind
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=128

# Maximum number of pressed combos at the same time (default: 4)
# 2 is enough for current use, but set 8 for safety margin
CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=8